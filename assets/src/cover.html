<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400&display=block" rel="stylesheet">
<style>
 body{margin:0;background:radial-gradient(circle at 78% 40%,#3a1f1d 0%,#1a1b1c 55%);color:#e3e3e3;font-family:"Google Sans",Roboto,sans-serif;overflow:hidden}
 .wrap{width:1280px;height:640px;display:flex;align-items:center;gap:64px;padding:0 96px;box-sizing:border-box}
 .logo{width:220px;height:220px;flex:none;filter:drop-shadow(0 20px 40px rgba(234,67,53,.25))}
 h1{margin:0 0 16px;font-size:68px;font-weight:500;letter-spacing:-1px;line-height:1.05}
 h1 span{color:#f28b82}
 p{margin:0 0 28px;font-size:26px;color:#c4c7c5;line-height:1.4;max-width:720px}
 .chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:20px;background:#2d2f31;font-size:18px;color:#a8c7fa}
 .dot{width:10px;height:10px;border-radius:50%;background:#ea4335}
 body.promo .wrap{width:440px;height:280px;padding:0 28px;gap:22px}
 body.promo .logo{width:96px;height:96px}
 body.promo h1{font-size:30px;margin-bottom:8px;letter-spacing:0}
 body.promo p{font-size:14px;margin:0}
 body.promo .chip{display:none}
</style></head><body>
<div class="wrap">
 <img class="logo" src="logo.svg">
 <div>
  <h1>Never forget to <span>record</span> a call again.</h1>
  <p>A Google Meet reminder that pops up the moment you join, so notes and recordings actually get started.</p>
  <div class="chip"><span class="dot"></span>Open source · No data collected</div>
 </div>
</div>
<script>if(location.hash==='#promo')document.body.classList.add('promo')</script>
</body></html>
